name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Go version drift guard
        run: |
          mod=$(sed -nE 's/^go ([0-9]+\.[0-9]+).*/\1/p' go.mod | head -1)
          img=$(sed -nE 's/^FROM .*golang:([0-9]+\.[0-9]+).*/\1/p' Dockerfile | head -1)
          if [ -z "$mod" ] || [ "$mod" != "$img" ]; then
            echo "Go version drift: go.mod has '$mod' but Dockerfile builder has '$img'"; exit 1
          fi
      - name: Validate deploy manifests
        # deploy/*.yaml is applied by hand (deploy/README.md); a schema or
        # indentation error otherwise surfaces only at `kubectl apply`.
        run: |
          set -euo pipefail
          ver=v0.7.0
          sum=c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
          curl -sSL -o kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${ver}/kubeconform-linux-amd64.tar.gz"
          echo "${sum}  kubeconform.tgz" | sha256sum -c -
          tar xzf kubeconform.tgz kubeconform
          # deploy/monitoring/ holds Prometheus Operator CRs; their schemas
          # come from the community CRDs-catalog, not the core k8s set.
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format and module tidiness
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt: the following files need formatting:"; echo "$unformatted"; exit 1
          fi
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"; exit 1
          }
      - name: Test
        run: |
          go test -race -count=1 \
            -coverpkg=./... \
            -coverprofile=coverage.out \
            ./...
      - name: Casefold audit (advisory ratchet)
        # Enforcing (ratchet) since 2026-11-11 after the 14-day warning window; see docs/casefold-gate.md.
        # Keep -v and -count=1: passing/cached test logs otherwise hide observations.
        env:
          DIBS_CASEFOLD_GATE: ratchet
        run: |
          set -euo pipefail
          echo '### Casefold audit' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          go test -count=1 -v -run '^TestRepoIDCasefoldGate$' ./pkg/store 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage summary
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          {
            echo "### Go coverage (\`-coverpkg=./...\`): ${total}%"
            echo
            echo '```'
            go tool cover -func=coverage.out | sort -k3 -n | head -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Floor: main measured 98.4–98.6% with -coverpkg=./... over runs 38396714441..38722506418; keep ~1.5–2 points below and ratchet up.
          awk -v t="$total" 'BEGIN { if (t+0 < 97) { print "coverage " t "% is below floor 97%"; exit 1 } }'
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 14

  mutation-report:
    # Advisory (phase 1 of #531): never blocks. Reports surviving mutants in
    # changed code; any ratchet needs a separate data-backed decision after
    # ~14 days of observed runtime and flakiness.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Gremlins mutation report (advisory)
        # Reproduce locally: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
        # && gremlins unleash --diff origin/main .
        # The path must be the module root: gremlins v0.6.0 keys both the
        # coverage profile and the `git diff` file names relative to it, and a
        # `./pkg/...` pattern is taken literally as a (missing) directory, so
        # nothing is scanned and the report is always empty.
        run: |
          set -uo pipefail
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          {
            echo '### Mutation report (gremlins v0.6.0, advisory, changed code vs origin/main)'
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          timeout 15m "$(go env GOPATH)/bin/gremlins" unleash --diff origin/main . 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "gremlins exit status: ${status} (124 = timed out; advisory only)" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
